<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Showhow test-notes mock · prototype</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--t:1;
--surface:#2F2F2F;--raised:#363636;--sunken:#292929;--ink:#FFFCF7;--soft:#FFFCF7B3;--muted:#FFFCF78C;--faint:#FFFCF766;--line:#FFFCF724;--wash:#FFFCF714;--chip:#3A3A3A;
--panel:#242424;--deep:#1C1C1C;--accent:#82B09A;--accent-tint:#82B09A33;--accent-wash:#82B09A26;--rec:#E3582D;--rec-wash:#E3582D1F;--rec-soft:#F28B6B;
--display:'Inter Tight',sans-serif;--mono:'JetBrains Mono',monospace;--out:cubic-bezier(0.23,1,0.32,1);--off:4px 4px 0 #82B09A}
body.slow{--t:10}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#1C1C1C;color:var(--ink);font:14px/1.5 Inter,sans-serif;-webkit-font-smoothing:antialiased;padding-top:44px;min-width:1320px}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;border-radius:4px;white-space:nowrap;transition:transform calc(160ms*var(--t)) var(--out),background-color calc(150ms*var(--t)) ease,opacity calc(150ms*var(--t)) ease}
button:active:not(:disabled):not(.row){transform:scale(.96)}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0}
.mono{font:400 11px/1.6 var(--mono);letter-spacing:.06em;color:var(--muted)}.up{text-transform:uppercase}
.i{flex:none}
/* mock chrome */
.mockbar{position:fixed;top:0;left:0;right:0;height:44px;background:#141414;border-bottom:1px solid #FFFFFF14;z-index:100;display:flex;align-items:center;justify-content:center}
.mockbar .in{width:1280px;display:flex;align-items:center;gap:6px;font:11px var(--mono);color:#FFFCF7AA}
.pill{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid #FFFFFF2E;border-radius:3px;padding:2px 6px;margin-right:10px;color:#FFFCF7}
.sbtn{height:28px;padding:0 10px;border:1px solid #FFFFFF24;border-radius:6px;font:11px var(--mono);color:#FFFCF7;display:inline-flex;align-items:center;gap:6px}
.sbtn b{font-weight:500;opacity:.6}
.sbtn[aria-pressed=true]{background:#FFFCF7;color:#1C1C1C;border-color:#FFFCF7}.sbtn[aria-pressed=true] b{opacity:.6}
.mockbar .sp{flex:1}
.mseg{display:inline-flex;align-items:center;gap:6px;margin-left:8px}
.caption{width:1280px;margin:0 auto;height:40px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--soft);font-size:13px}
.caption .cb{display:flex;gap:8px}
.cbtn{height:28px;padding:0 12px;border:1px solid #FFFFFF2E;border-radius:4px;font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#FFFCF7}
@media (hover:hover) and (pointer:fine){.cbtn:hover,.sbtn:hover{background:#FFFFFF14}.sbtn[aria-pressed=true]:hover{background:#FFFCF7}}
.window{width:1280px;height:800px;margin:0 auto 20px;border-radius:10px;overflow:hidden;position:relative;display:flex;background:var(--surface);box-shadow:0 24px 80px #0006;transition:opacity calc(200ms*var(--t)) ease-out}
/* buttons */
.btn{padding:10px 14px;border-radius:4px;font:500 11px/15px var(--mono);letter-spacing:.6px;text-transform:uppercase;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:#2F2F2F}
.btn.secondary{border:1px solid var(--line);color:var(--ink);padding:9px 13px}
.btn.ghost{color:var(--soft)}
.btn.side{background:#FFFCF714;color:var(--ink)}.btn.side.on{background:#82B09A33}
.btn.inverse{background:#FFFCF7;color:#2F2F2F}.btn.chip{background:#3A3A3A;color:var(--ink)}
.btn.danger{background:#E3582D;color:#fff}
.btn.full{width:100%}
.ib32{width:32px;height:32px;display:inline-grid;place-items:center;color:var(--soft);border-radius:4px}
@media (hover:hover) and (pointer:fine){.btn.primary:hover{background:#8FBBA6}.btn.secondary:hover,.ib32:hover,.btn.ghost:hover{background:var(--wash)}.btn.side:hover{background:#FFFCF724}.btn.danger:hover{background:#EE6A3F}}
.tag{display:inline-block;font:500 10px/1.5 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;white-space:nowrap;align-self:flex-start}
.tag.ok{background:var(--accent);color:#2F2F2F}.tag.no{background:#FFFCF71A;color:#FFFCF7AA}.tag.mk{background:var(--accent-tint);color:var(--accent)}.tag.bad{background:var(--rec);color:#fff}.tag.wr{background:var(--rec-wash);color:var(--rec-soft)}.tag.def{background:#FFFCF71A;color:#FFFCF7AA;margin-left:8px;align-self:center}
/* sidebar */
.sb{width:272px;flex:none;background:var(--panel);padding:18px;display:flex;flex-direction:column;min-height:0}
.logo{display:flex;align-items:center;gap:12px;padding:6px 0 0 6px;margin-bottom:22px}
.mark{width:40px;height:40px;background:#FFFCF7;border:1px solid #2F2F2F;box-shadow:var(--off);display:grid;place-items:center;color:#2F2F2F;position:relative}
.logo span{font:600 17px var(--display);letter-spacing:-.01em}
.sblabel{font:400 10px var(--mono);letter-spacing:.06em;color:var(--faint);text-transform:uppercase;margin:20px 0 10px 8px}
.search{height:36px;border-radius:6px;background:#FFFFFF10;border:1px solid #FFFFFF14;display:flex;align-items:center;gap:8px;padding:0 10px;color:var(--faint);margin-bottom:8px}
.rows{flex:1;overflow-y:auto;min-height:0;margin:0 -6px;padding:0 6px}
.rw{display:grid;grid-template-rows:1fr;transition:grid-template-rows calc(220ms*var(--t)) ease-out,opacity calc(220ms*var(--t)) ease-out,visibility 0s}
.rw.gone{grid-template-rows:0fr;opacity:0;visibility:hidden;pointer-events:none;transition:grid-template-rows calc(220ms*var(--t)) ease-out,opacity calc(220ms*var(--t)) ease-out,visibility 0s calc(220ms*var(--t))}
.rwi{overflow:hidden;min-height:0}
.row{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:5px;width:100%;padding:10px;border-radius:6px;text-align:left;white-space:normal;margin-bottom:4px;transition:background-color calc(120ms*var(--t)) ease}
.row.on{background:#FFFCF71A}
@media (hover:hover) and (pointer:fine){.row:not(.on):hover{background:#FFFCF70D}}
.rtt{display:grid;font:500 13px/1.3 Inter;color:var(--ink)}.rtt>span{grid-area:1/1}
.rm{font:400 10px/1.4 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.strip{position:absolute;left:0;right:0;bottom:0;height:3px;opacity:0;transition:opacity calc(300ms*var(--t)) ease;background:repeating-linear-gradient(90deg,#82B09A 0 6px,#82B09A40 6px 12px,#82B09A99 12px 15px,#82B09A26 15px 21px);background-size:42px 3px;animation:strip calc(900ms*var(--t)) steps(7) infinite;animation-play-state:paused}
.row.proc .strip{opacity:1;animation-play-state:running}
@keyframes strip{to{background-position:42px 0}}
.rowflash{animation:flash calc(600ms*var(--t)) ease-out}
@keyframes flash{from{background-color:#82B09A59}}
.sbempty{font:400 11px/1.6 var(--mono);color:var(--faint);padding:12px 8px;letter-spacing:.06em;text-transform:uppercase;opacity:0;transition:opacity calc(240ms*var(--t)) ease;height:0;overflow:hidden}.sbempty.on{opacity:1;height:auto}
.sbfoot{padding-top:12px}
/* detail */
.main{flex:1;min-width:0;overflow-y:auto;background:var(--surface);position:relative}
.dt{padding:44px 48px 56px}
.dh{display:flex;justify-content:space-between;gap:24px}
.dhl{min-width:0}
.dacts{display:flex;gap:8px;align-items:flex-start;padding-top:2px;flex:none}
.title{margin:0;display:grid;font:600 32px/1.15 var(--display);letter-spacing:-.02em;color:var(--ink)}.title>span{grid-area:1/1}.title>.faint{color:var(--faint)}
.meta{margin-top:6px}
.sumslot{min-height:0}.sumslot.k{min-height:22px;margin-top:10px}
.sum{font:14px/1.5 Inter;color:#FFFCF7B3;max-width:640px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:10px}
.sum.in{animation:sumin calc(240ms*var(--t)) var(--out) both}
@keyframes sumin{from{opacity:0;transform:translateY(4px)}}
.skel{height:14px;width:360px;border-radius:4px;margin-top:6px;background:linear-gradient(90deg,#FFFCF714 0,#FFFCF72E 50%,#FFFCF714 100%);background-size:200% 100%;animation:skel calc(1400ms*var(--t)) linear infinite}
@keyframes skel{to{background-position:-200% 0}}
.video{margin-top:24px;height:290px;border-radius:8px;background:var(--panel);position:relative;overflow:hidden}
.video canvas{position:absolute;inset:0;width:100%;height:100%}
.tp{position:absolute;left:16px;right:16px;bottom:12px;display:flex;align-items:center;gap:12px;color:#FFFCF7AA}
.scrub{flex:1;height:8px;position:relative}.scrub:before{content:"";position:absolute;left:0;right:0;top:3px;height:2px;background:#FFFCF71F}
.scrub i{position:absolute;top:0;width:2px;height:8px;background:#FFFCF7AA}.scrub i.o{background:var(--rec)}
.gh{display:flex;align-items:center;gap:20px;margin-top:28px;border-bottom:1px solid var(--line);padding-bottom:0}
.gh .tab{padding:10px 0;border-bottom:2px solid var(--ink);margin-bottom:-1px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.gh .tab.off{border-color:transparent;color:var(--muted)}.gh .sp{flex:1}.gh .btn{margin-bottom:8px}
.nog{margin-top:20px;padding:20px;border-radius:8px;background:var(--sunken);display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--soft)}
.step{display:grid;grid-template-columns:32px 160px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.step .n{font:400 11px var(--mono);color:var(--muted);padding-top:2px}
.step h4{margin:0;font:500 15px/1.4 Inter}.step q{display:block;margin-top:6px;font-size:13px;color:var(--muted);quotes:none}
.step .sm{margin-top:10px;display:flex;gap:10px;align-items:center}
.shot{width:160px;height:90px;border-radius:6px;overflow:hidden;outline:1px solid oklch(1 0 0/.1);outline-offset:-1px;display:block}
.emptymain{height:100%;display:grid;place-items:center;text-align:center}
.emptymain h2{margin:0 0 6px;font:600 32px var(--display);letter-spacing:-.02em}
/* menu */
.menu{position:absolute;z-index:60;min-width:200px;background:#363636;border:1px solid #FFFCF724;border-radius:6px;box-shadow:var(--off);padding:4px;opacity:0;transform:scale(.96);transition:opacity calc(160ms*var(--t)) var(--out),transform calc(160ms*var(--t)) var(--out)}
.menu.on{opacity:1;transform:none}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;border-radius:4px;font:13px/1.4 Inter;text-align:left;color:var(--ink)}
.mi:focus-visible{outline:none;background:var(--wash)}
.mi .hint{margin-left:auto;font:400 11px var(--mono);color:var(--muted)}
.mi.danger{color:var(--rec-soft)}
.mi .two{display:flex;flex-direction:column;min-width:0}.mi .two .s{font:400 11px var(--mono);color:var(--muted)}
.mi .ck{margin-left:auto;color:var(--accent);opacity:0}.mi[aria-selected=true] .ck{opacity:1}
.mi .nm{display:flex;align-items:center}
.mdiv{height:1px;background:var(--line);margin:4px 0}
@media (hover:hover) and (pointer:fine){.mi:hover{background:var(--wash)}}
/* sheet */
.scrim{position:absolute;inset:0;z-index:50;background:#000000AA;display:grid;place-items:center;opacity:0;transition:opacity calc(180ms*var(--t)) ease-out}
.scrim.on{opacity:1}
.sheet{width:440px;max-width:calc(100% - 48px);background:#363636;border:1px solid #FFFCF724;border-radius:10px;box-shadow:var(--off);padding:24px;transform:scale(.97);transition:transform calc(200ms*var(--t)) var(--out)}
.scrim.on .sheet{transform:none}
.sheet .lab{font:400 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sheet h3{margin:4px 0 12px;font:600 22px/1.2 var(--display);letter-spacing:-.01em}
.sheet .body{color:var(--soft);font-size:14px;line-height:1.55}
.sheet .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:24px}
/* toast */
.toast{position:absolute;left:50%;bottom:24px;z-index:70;transform:translate(-50%,8px);opacity:0;background:#363636;border:1px solid #FFFCF724;border-radius:6px;box-shadow:var(--off);padding:12px 16px;display:flex;align-items:center;gap:20px;font-size:13px;transition:opacity calc(200ms*var(--t)) var(--out),transform calc(200ms*var(--t)) var(--out)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast button{font:500 11px var(--mono);letter-spacing:.06em;color:var(--accent);padding:4px 6px;text-transform:uppercase}
@media (hover:hover) and (pointer:fine){.toast button:hover{background:var(--accent-wash)}}
/* progress bar */
.bar{height:11px;position:relative}
.bar .fill{position:absolute;inset:0 auto 0 0;width:0;visibility:hidden}
.bar canvas{display:block;width:100%;height:11px;image-rendering:pixelated}
.xfade{display:inline-grid}.xfade>span{grid-area:1/1}
/* settings */
.set{padding:44px 48px;max-width:1056px}
.set h1{margin:0 0 20px;font:600 32px/1.15 var(--display);letter-spacing:-.02em}
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line)}
.tabs button{padding:0 0 12px;border-radius:0;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.intro{color:var(--muted);margin:22px 0 22px;max-width:700px}
.card{padding:0 0 24px;border-bottom:1px solid var(--line);margin-bottom:24px}
.card .hd{display:flex;justify-content:space-between;align-items:flex-start}
.card h2{margin:0;font:600 22px/1.2 var(--display);letter-spacing:-.01em}
.card .desc{color:var(--muted);margin:14px 0}
.status{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:3px;background:#FFFCF71A;color:var(--muted)}.status.on{background:var(--accent-tint);color:var(--accent)}
.field{margin:16px 0 18px;max-width:520px}
.field .lbl{display:block;margin-bottom:8px;font:400 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.selbtn{width:100%;height:40px;border-radius:4px;border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font:14px Inter;color:var(--ink);text-align:left}
@media (hover:hover) and (pointer:fine){.selbtn:hover{background:var(--wash)}}
.selbtn[aria-expanded=true]{border-color:var(--accent)}
.selbtn .i{transition:transform calc(160ms*var(--t)) var(--out)}.selbtn[aria-expanded=true] .i{transform:rotate(180deg)}
.txt{width:100%;height:40px;border-radius:4px;border:1px solid var(--line);background:transparent;padding:0 12px;font:14px Inter;color:var(--ink)}
.txt::placeholder{color:var(--faint)}.txt:focus{outline:none;border-color:var(--accent)}
.help{font-size:12px;color:var(--muted);margin-top:6px}
.other{margin-top:16px;animation:sumin calc(200ms*var(--t)) var(--out) both}
.srow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.srow .l{font-size:15px}.srow .v{font:400 11px var(--mono);letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:2px;padding:1px 4px;margin-left:-4px;border-radius:3px;display:inline-block}
.vflash{animation:flash calc(600ms*var(--t)) ease-out}
.toggle{width:36px;height:20px;border-radius:10px;background:#FFFCF72E;position:relative}.toggle:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#FFFCF7}
/* editor */
.ed{flex-direction:column;width:100%}
.ed.fade{opacity:0}
.tb{height:44px;flex:none;background:#2F2F2F;border-bottom:1px solid #FFFCF714;display:flex;align-items:center;padding:0 16px;gap:12px;font:400 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#FFFCF7}
.lights{display:flex;gap:8px;margin-right:4px}.lights i{width:12px;height:12px;border-radius:50%;background:#FF5F57}.lights i:nth-child(2){background:#FEBC2E}.lights i:nth-child(3){background:#28C840}
.mk22{width:22px;height:22px;background:#FFFCF7;box-shadow:2px 2px 0 #82B09A;display:grid;place-items:center;color:#2F2F2F;margin-right:6px}
.tbbtn{border:1px solid #FFFCF724;border-radius:4px;padding:6px 10px;display:inline-flex;align-items:center;gap:8px;font:400 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#FFFCF7}
.tbl{display:inline-flex;align-items:center;gap:8px;color:#FFFCF7AA;padding:6px 8px;border-radius:4px}
.tbdiv{width:1px;height:16px;background:#FFFCF724}
@media (hover:hover) and (pointer:fine){.tbbtn:hover,.tbl:hover{background:#FFFCF714}}
.edbody{flex:1;display:flex;min-height:0}
.edleft{flex:1;display:flex;flex-direction:column;min-width:0}
.prev{flex:1;background:#242424;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:0}
.canvas{width:560px;height:330px;background:linear-gradient(135deg,#D0E4DA,#82B09A 70%,#CFE4DA);display:grid;place-items:center}
.bw{width:440px;height:270px;background:#fff;border-radius:6px;box-shadow:0 12px 30px #0003;overflow:hidden}
.bw .bt{height:20px;background:#F0EEE8;display:flex;align-items:center;gap:5px;padding-left:8px}.bw .bt i{width:6px;height:6px;border-radius:50%;background:#C9C5BC}
.bw .bb{display:flex;gap:14px;padding:14px}.bw .sbm{width:80px;height:226px;background:#EFEDE7;border-radius:3px}.bw .ln{height:9px;background:#EAE8E3;border-radius:2px;margin-bottom:8px}
.ctl{width:560px;display:flex;align-items:center;gap:14px;color:#FFFCF7}
.pb{width:32px;height:32px;background:var(--accent);color:#2F2F2F;display:grid;place-items:center;border-radius:4px}
.ctl .t{flex:1;height:2px;background:#FFFCF71F;position:relative}.ctl .t:after{content:"";position:absolute;left:0;top:0;bottom:0;width:29%;background:var(--accent)}
.tl{height:220px;flex:none;background:var(--sunken);border-top:1px solid #FFFCF714;position:relative;overflow:hidden}
.tlt{height:44px;display:flex;align-items:center;gap:6px;padding:0 16px;color:#FFFCF7AA}
.tlt .tb2{width:32px;height:28px;display:grid;place-items:center;border-radius:4px}.tlt .tb2.on{background:var(--accent-tint);color:var(--accent)}.tlt .info{margin-left:auto;font:400 10px var(--mono);letter-spacing:.06em;color:var(--muted)}
.ruler{height:20px;position:relative;margin-left:80px;border-bottom:1px solid #FFFCF714;font:400 10px var(--mono);color:var(--muted)}
.ruler span{position:absolute;top:2px}
.lane{height:32px;margin-top:4px;position:relative}
.lane .nm{position:absolute;left:14px;top:0;line-height:32px;font:400 10px var(--mono);letter-spacing:.06em;color:var(--muted)}
.lane .tr{position:absolute;left:80px;right:0;top:0;height:28px;background:#FFFCF70D}
.pillz{position:absolute;top:0;height:28px;line-height:28px;padding:0 8px;font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;border-radius:2px;white-space:nowrap;overflow:hidden}
.pillz.ac{background:var(--accent);color:#2F2F2F}.pillz.cut{background:var(--rec);color:#fff}.pillz.tx{background:#1C1C1C;color:#FFFCF7;border:1px solid #FFFCF71F;line-height:26px}
.wave{position:absolute;left:80px;right:0;top:0;height:28px;display:flex;align-items:center;gap:2px;overflow:hidden}.wave i{width:3px;background:var(--accent);border-radius:1px;flex:none;opacity:.8}
.ph{position:absolute;top:44px;bottom:0;left:240px;width:2px;background:var(--rec)}.ph:before{content:"";position:absolute;top:0;left:-5px;width:12px;height:10px;background:var(--rec)}
.insp{width:320px;flex:none;background:#2F2F2F;border-left:1px solid #FFFCF714;display:flex;flex-direction:column}
.insp .h{padding:16px 20px;border-bottom:1px solid #FFFCF714}.insp .h h3{margin:2px 0 0;font:600 18px var(--display);letter-spacing:-.01em}
.insp .c{padding:20px;flex:1;display:flex;flex-direction:column;gap:6px}

.seg{display:flex;border:1px solid #FFFCF724;border-radius:4px;padding:2px}.seg span{flex:1;text-align:center;padding:6px 0;font:500 10px var(--mono);letter-spacing:.08em;color:#FFFCF7AA;border-radius:3px}.seg .on{background:#FFFCF7;color:#2F2F2F}

/* ---------- dither progress bar ----------
   The hidden .fill keeps its width as the source of truth; a canvas draws it as a pixel grid.
   Solid cells behind the edge, a 4x4 Bayer-dithered frontier, faint dots ahead. Only the
   frontier shimmers, and only while the bar is moving. */
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5].map(v=>(v+.5)/16);
function ditherBar(bar){
  if(bar._dither) return; bar._dither=true;
  const fill=bar.querySelector('.fill'), cv=document.createElement('canvas'); bar.appendChild(cv);
  const PITCH=4, SIZE=3, ROWS=3, BAND=96; let shown=0, raf=0;
  const target=()=>{ const w=fill.style.width; return w.endsWith('%')?parseFloat(w)/100:0 };
  const draw=(moving)=>{
    const dpr=devicePixelRatio||1, W=bar.clientWidth; if(!W) return;
    cv.width=Math.round(W*dpr); cv.height=Math.round(11*dpr);
    const x=cv.getContext('2d'); x.scale(dpr,dpr); x.clearRect(0,0,W,11);
    const cols=Math.floor((W+PITCH-SIZE)/PITCH), done=bar.classList.contains('done')||shown>=0.999;
    const E=shown*(W+BAND)-BAND/2;
    for(let c=0;c<cols;c++){
      const cx=c*PITCH+SIZE/2, d=done?1:Math.min(1,Math.max(0,(E-cx)/BAND+.5));
      for(let r=0;r<ROWS;r++){
        let t=BAYER[(r%4)*4+(c%4)]; if(moving&&!mqR.matches&&d>0&&d<1) t=Math.min(.98,Math.max(.02,t+(Math.random()-.5)*.35));
        const px=c*PITCH, py=r*PITCH;
        if(d>t){ x.fillStyle=(d<.6&&!done)?'#C4DBCE':'#82B09A'; x.fillRect(px,py,SIZE,SIZE) }
        else { x.fillStyle='#FFFCF71F'; x.fillRect(px+1,py+1,1,1) }
      }
    }
  };
  const tick=()=>{
    const tg=target(), k=mqR.matches?1:Math.min(1,0.18/Math.max(.1,parseFloat(getComputedStyle(document.body).getPropertyValue('--t'))||1));
    shown+=(tg-shown)*k; if(tg<shown&&tg===0) shown=0;
    const moving=Math.abs(tg-shown)>0.0015; if(!moving) shown=tg;
    draw(moving); raf=moving?requestAnimationFrame(tick):0;
  };
  const kick=()=>{ if(!raf) raf=requestAnimationFrame(tick) };
  new MutationObserver(kick).observe(fill,{attributes:true,attributeFilter:['style']});
  new MutationObserver(kick).observe(bar,{attributes:true,attributeFilter:['class']});
  new ResizeObserver(kick).observe(bar); kick();
}
new MutationObserver(()=>document.querySelectorAll('.bar').forEach(ditherBar)).observe(document.body,{childList:true,subtree:true});
document.querySelectorAll('.bar').forEach(ditherBar);
</script>
