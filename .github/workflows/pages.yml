name: Landing page

# Publishes site/ to Cloudflare Pages (project "showhow") on a push to main that
# changes site/. Separate from build.yml: the app release workflow stays single.
on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: landing-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy landing page
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping deploy. See docs/landing/deploy.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        if: steps.secrets.outputs.ready == 'true'
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Deploy to Cloudflare Pages
        if: steps.secrets.outputs.ready == 'true'
        working-directory: site
        run: npx --yes wrangler@4.152.0 pages deploy dist --project-name showhow --branch main --commit-hash "$GITHUB_SHA"
